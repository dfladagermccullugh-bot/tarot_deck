name: Tarot
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  TarotCore:
    path: Core
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  Tarot:
    type: application
    platform: iOS
    sources:
      - path: App
      # Copied into the app as a folder so the deck keeps its deck.json + images layout.
      - path: BundledDecks/RiderWaiteSmith
        type: folder
        buildPhase: resources
    dependencies:
      - package: TarotCore
      - package: ZIPFoundation
    scheme:
      gatherCoverageData: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tarotdeck
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tarot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMotionUsageDescription: Motion is used to shuffle the deck as you move the phone.
