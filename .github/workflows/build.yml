name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test core logic
        run: swift test --package-path Core

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project Tarot.xcodeproj -scheme Tarot -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tarot.app Payload/
          zip -qr Tarot.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Tarot-ipa
          path: Tarot.ipa
